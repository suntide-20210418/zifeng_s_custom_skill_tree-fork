# Gradle Daemon JVM criteria (Gradle 8.8+).
# The default JAVA_HOME on some machines is a newer JDK (e.g. 25) that this Gradle 8.8 wrapper
# cannot run on, while the project itself compiles/runs on Java 21 via its toolchain. Declaring the
# daemon toolchain here makes Gradle pick a detected JDK 21 for the daemon instead of pinning an
# absolute org.gradle.java.home path (which is machine-specific and breaks other machines).
toolchainVersion=21
